name: Monthly standards recheck

on:
  schedule:
    # 02:00 UTC = 09:00 Thailand. Day 1 of every month.
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run recheck script
        id: run
        run: |
          set +e
          python scripts/recheck_standards.py | tee recheck_output.txt
          # ${PIPESTATUS[0]} = python's exit, NOT tee's (which is always 0)
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit date-stamp refresh (clean run only)
        if: steps.run.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain STANDARDS.md)" ]; then
            git add STANDARDS.md
            git commit -m "chore(standards): monthly recheck — editions confirmed ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Open issue when a change is detected
        if: steps.run.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0];
            let report = '';
            try { report = fs.readFileSync('recheck_output.txt', 'utf8').trim(); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[standards-recheck] Edition or lifecycle-stage change — needs review — ${today}`,
              body: [
                'The monthly recheck flagged an **edition or lifecycle-stage change** vs `STANDARDS.md`.',
                'STANDARDS.md was **left unchanged** — no silent auto-edit. The exact cause and per-source',
                'remedy are in the script report below (each `[NEW]` / `[ACTION]` line states which it is):',
                '',
                '```',
                report,
                '```',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'A human must, matching the report above (a source may need MORE THAN ONE):',
                '- **New edition (different year):** verify it at iso.org, update `STANDARDS.md` (edition + dates),',
                '  and bump `current_year` for that source in `scripts/recheck_standards.py` via PR.',
                '- **Lifecycle-stage change (same edition year, e.g. `90.92 → 90.93`):** verify the stage at iso.org',
                '  and update/clear `known_stage` for that source in `scripts/recheck_standards.py` (do NOT bump',
                '  `current_year`).',
                '- **Both at once** (a revision publishes — the year bumps *and* the pinned stage moves): do BOTH —',
                '  bump `current_year` AND clear/update the now-stale `known_stage` for that source.',
              ].join('\n'),
              labels: ['standards-recheck', 'needs-attention'],
            });

      - name: Open issue on script error
        if: steps.run.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[standards-recheck] Monthly recheck error — ${today}`,
              body: [
                'Auto-recheck workflow detected an error fetching or parsing a standards source page.',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Likely causes:',
                '- iso.org changed HTML structure',
                '- Network timeout (transient — re-run workflow)',
                '',
                'Action: manually verify current editions at iso.org and update `STANDARDS.md`. If a source page restructured, update the regex in `scripts/recheck_standards.py`.',
              ].join('\n'),
              labels: ['standards-recheck', 'needs-attention'],
            });
