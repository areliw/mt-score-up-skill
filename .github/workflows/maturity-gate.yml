name: maturity-gate

# Maturity ladder enforcement: a changed skill's `status:` must not out-rank its evidence
# (semi-stable ⟹ has A/B; stable ⟹ has a signed MT peer-review). Deterministic, no AI / no key.
# Stricter-but-cleaner companion to ab-gate (which nudges A/B coverage on every skill):
# this one fires only on an actual over-claim, so a `draft` edit never trips it.
# Advisory (branch protection has required_status_checks=null) — a visible signal.

on:
  pull_request:
    paths:
      - 'skills/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  maturity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Find changed skill files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only \
            | grep -E '^skills/.+\.md$' | grep -vE '/(README|INDEX)\.md$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then echo "no skill files changed"; else echo "changed:"; echo "$files"; fi
      - name: status ≤ evidence check
        if: steps.changed.outputs.files != ''
        run: python scripts/check_maturity_gate.py ${{ steps.changed.outputs.files }}
