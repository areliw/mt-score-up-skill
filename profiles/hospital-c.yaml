# Layout profile — หน่วยงานตัวอย่าง C (Thai Red Cross, Microbiology)
# Layout variant 3: COMPACT header — logo (carries the org identity) + WI title + doc-control.
# NO org banner band (identity lives in the logo). In this org's docs the signature block and
# revision-history are SEPARATE body tables, not part of the header.
slug: hospital-c
org_unit: ฝ่ายจุลชีววิทยา โรงพยาบาลตัวอย่าง C
doc_type: วิธีปฏิบัติงาน (Work Instruction)
logo: profiles/hospital-c-logo.png
# no `org:` key → build_header_from_spec emits no banner row (has_banner=False)
header:
  - "{doc_type} | เอกสารเลขที่ : {doc_code} | หน้าที่ : {page}/{total_pages}"
  - "เรื่อง : {doc_subject} | แก้ไขครั้งที่ : {rev_no} | วันที่ : {effective_date}"
