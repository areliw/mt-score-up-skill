name: ab-gate

# P4 — A/B coverage gate. On a PR that adds/edits skills, confirm each changed
# skill has an A/B record in eval/_ab_slim.json. Deterministic, no AI / no API key.
# The actual ×3 blind-judge runs via Claude Code Workflow (eval/harness/ab-x3.js).
# Advisory (branch protection has required_status_checks=null) — a visible signal.

on:
  pull_request:
    paths:
      - 'skills/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  ab-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Find changed skill files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only             | grep -E '^skills/.+\.md$' | grep -vE '/(README|INDEX)\.md$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then echo "no skill files changed"; else echo "changed:"; echo "$files"; fi
      - name: A/B coverage check
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: echo "$FILES" | xargs -r python scripts/ab_gate_check.py
